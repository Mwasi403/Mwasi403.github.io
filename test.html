<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeNet Pay (Test)</title>

<style>
  body {
    font-family: system-ui;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  .card {
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    width: 350px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  }

  h2 {
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #ddd;
  }

  .methods {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .methods button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    cursor: pointer;
    background: #fff;
  }

  .methods button.active {
    background: #111;
    color: #fff;
  }

  button.pay {
    width: 100%;
    padding: 12px;
    border: none;
    background: #111;
    color: white;
    border-radius: 8px;
    cursor: pointer;
  }

  .msg {
    margin-top: 10px;
    text-align: center;
    font-size: 0.85rem;
    color: #555;
  }
</style>
</head>

<body>

<div class="card">
  <h2>PrimeNet Pay (Test)</h2>

  <!-- ✅ 10-digit local number -->
  <input id="phone" placeholder="097XXXXXXX" maxlength="10">

  <input id="amount" type="number" placeholder="Amount (ZMW)">

  <div class="methods">
    <button id="mobileBtn" class="active" onclick="setMethod('mobile')">Mobile</button>
    <button id="cardBtn" onclick="setMethod('card')">Card</button>
  </div>

  <button class="pay" onclick="pay()">Pay Now</button>
  <div class="msg" id="msg"></div>
</div>

<script>
const CLIENT_ID = "gQrXmWH8n4GUMqhVSSOFeKEje2MheETYR064Bsf94i2FRwPvLNtMcLuu1NIDzx5i";

// ⚠️ Test checkout URL
const BASE_URL = "http://test.primenetpay.com:8000/payment-checkout";

let method = "mobile";

function setMethod(m) {
  method = m;
  document.getElementById("mobileBtn").classList.toggle("active", m === "mobile");
  document.getElementById("cardBtn").classList.toggle("active", m === "card");
}

function setMsg(text) {
  document.getElementById("msg").innerText = text;
}

function generateRef() {
  return "TEST" + Date.now();
}

function pay() {
  const phoneInput = document.getElementById("phone").value.trim();
  const amountInput = document.getElementById("amount").value;

  // ✅ Validate 10-digit number starting with 0
  if (!/^0\d{9}$/.test(phoneInput)) {
    return setMsg("Enter valid number (e.g. 097XXXXXXX)");
  }

  if (!amountInput || amountInput < 1) {
    return setMsg("Enter valid amount");
  }

  // ✅ Convert to international format
  const phone = "26" + phoneInput;

  const external_id = generateRef();

  // ✅ Use safe payment type
  let type = method === "card" ? "card" : "mobile-money";

  // ✅ Format amount
  const amount = parseFloat(amountInput).toFixed(2);

  const url = `${BASE_URL}/${CLIENT_ID}/${amount}/${external_id}/${type}/ZMW`;

  console.log("FINAL URL:", url);
  console.log("PHONE:", phone);

  setMsg("Redirecting to payment page...");

  // ✅ Open checkout page
  window.open(url, "_blank");
}
</script>

</body>
</html>
