<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeNet Pay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .card {
    background: #fff;
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  h2 {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 24px;
    color: #111;
  }

  label {
    display: block;
    font-size: 0.8rem;
    color: #555;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 0.95rem;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }

  input:focus { border-color: #333; }

  .methods {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }

  .method {
    flex: 1;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    color: #555;
  }

  .method.active {
    border-color: #111;
    background: #111;
    color: #fff;
  }

  button.pay {
    width: 100%;
    padding: 13px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  button.pay:hover { background: #333; }

  .msg {
    margin-top: 14px;
    font-size: 0.82rem;
    text-align: center;
    min-height: 18px;
  }

  .msg.error { color: #c00; }
</style>
</head>
<body>

<div class="card">
  <h2>PrimeNet Pay</h2>

  <label>Mobile Number</label>
  <input type="tel" id="phone" placeholder="260XXXXXXXXX" maxlength="15">

  <label>Amount (ZMW)</label>
  <input type="number" id="amount" placeholder="0.00" min="1" step="0.01">

  <div class="methods">
    <button class="method active" id="btn-mobile" onclick="selectMethod('mobile')">Mobile Money</button>
    <button class="method" id="btn-card" onclick="selectMethod('card')">Card</button>
  </div>

  <button class="pay" onclick="pay()">Pay Now</button>
  <div class="msg" id="msg"></div>
</div>

<script>
  const CLIENT_ID = 'gQrXmWH8n4GUMqhVSSOFeKEje2MheETYR064Bsf94i2FRwPvLNtMcLuu1NIDzx5i';
  let method = 'mobile';

  function selectMethod(m) {
    method = m;
    document.getElementById('btn-mobile').className = 'method' + (m === 'mobile' ? ' active' : '');
    document.getElementById('btn-card').className   = 'method' + (m === 'card'   ? ' active' : '');
  }

  function setMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + (type || '');
  }

  function genRef() {
    return 'TXN-' + Date.now() + '-' + Math.random().toString(36).slice(2,6).toUpperCase();
  }

  function pay() {
    const phone  = document.getElementById('phone').value.trim();
    const amount = parseFloat(document.getElementById('amount').value);

    if (!/^260\d{9}$/.test(phone)) return setMsg('Enter a valid number (260XXXXXXXXX)', 'error');
    if (isNaN(amount) || amount < 1) return setMsg('Enter a valid amount (min K1.00)', 'error');

    const id   = genRef();
    const type = method === 'card' ? 'card' : 'mobile money';
    const url  = `https://checkout.primenetpay.com/payment-checkout/${CLIENT_ID}/${amount}/${id}/${type}/ZMW`;

    window.location.href = url;
  }
</script>
</body>
</html>
