<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeNet Pay (Test)</title>

<style>
  body {
    font-family: system-ui;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  .card {
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    width: 350px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  }

  h2 {
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #ddd;
  }

  .methods {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .methods button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    cursor: pointer;
    background: #fff;
  }

  .methods button.active {
    background: #111;
    color: #fff;
  }

  button.pay {
    width: 100%;
    padding: 12px;
    border: none;
    background: #111;
    color: white;
    border-radius: 8px;
    cursor: pointer;
  }

  .msg {
    margin-top: 10px;
    text-align: center;
    font-size: 0.85rem;
    color: #555;
  }
</style>
</head>

<body>

<div class="card">
  <h2>PrimeNet Pay (Test)</h2>

  <input id="phone" placeholder="0XXXXXXXXX">
  <input id="amount" type="number" placeholder="Amount (ZMW)">

  <div class="methods">
    <button id="mobileBtn" class="active" onclick="setMethod('mobile')">Mobile</button>
    <button id="cardBtn" onclick="setMethod('card')">Card</button>
  </div>

  <button class="pay" onclick="pay()">Pay Now</button>
  <div class="msg" id="msg"></div>
</div>

<script>
const CLIENT_ID = "gQrXmWH8n4GUMqhVSSOFeKEje2MheETYR064Bsf94i2FRwPvLNtMcLuu1NIDzx5i";

// ✅ TEST ENV URL (VERY IMPORTANT)
const BASE_URL = "http://test.primenetpay.com:8000/payment-checkout";

let method = "mobile";

function setMethod(m) {
  method = m;
  document.getElementById("mobileBtn").classList.toggle("active", m === "mobile");
  document.getElementById("cardBtn").classList.toggle("active", m === "card");
}

function setMsg(text) {
  document.getElementById("msg").innerText = text;
}

function generateRef() {
  return "TEST-" + Date.now();
}

function pay() {
  const phone  = document.getElementById("phone").value.trim();
  const amount = document.getElementById("amount").value;

  if (!/^0\d{9}$/.test(phone)) {
    return setMsg("Enter valid number (0XXXXXXXXX)");
  }

  if (!amount || amount < 1) {
    return setMsg("Enter valid amount");
  }

  const external_id = generateRef();

  // ⚠️ Try alternative if needed: "mobile-money"
  let type = method === "card" ? "card" : "mobile%20money";

  const url = `${BASE_URL}/${CLIENT_ID}/${amount}/${external_id}/${type}/ZMW`;

  console.log("FINAL URL:", url);

  setMsg("Opening payment page...");

  // ✅ OPEN IN NEW TAB (avoids HTTPS blocking issue)
  window.open(url, "_blank");
}
</script>

</body>
</html>
